[tool.poetry]
name = "mpp-bds-client"
version = "0.1.0"
description = "Minimal MPP + Tempo client to call paid BDS Core API routes (/mpp/snapshot/...)"
authors = ["Powerloom"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.27.0"
pympp = { version = "^0.4.2", extras = ["tempo"] }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
